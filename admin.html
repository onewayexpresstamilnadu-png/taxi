<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Vettri Travels | Admin Panel</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fa;color:#182230}.top{background:#111827;color:#fff;padding:16px 5%;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:900}.brand span{color:#ff7300}.wrap{width:min(1200px,92%);margin:28px auto}.card{background:#fff;border:1px solid #e4e8ed;border-radius:14px;padding:22px;box-shadow:0 10px 30px #1118270b}.login{max-width:420px;margin:70px auto}.login h1{margin-top:0}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #d9dee5;border-radius:8px}.btn{border:0;border-radius:8px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#ff7300;color:#fff}.dark{background:#111827;color:#fff}.green{background:#169653;color:#fff}.red{background:#c73838;color:#fff}.muted{color:#6d7785;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.stat{background:#fff;border:1px solid #e4e8ed;border-radius:12px;padding:18px}.stat b{font-size:25px;display:block}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.table-wrap{overflow:auto}.booking{border:1px solid #e3e7ec;border-radius:12px;padding:16px;margin:12px 0;background:#fff}.booking-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.badge{padding:5px 9px;border-radius:20px;font-size:10px;font-weight:900}.pending{background:#fff1db;color:#a85b00}.approved{background:#e5f8ec;color:#15723b}.rejected{background:#fdeaea;color:#a52323}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0}.item{background:#f7f8fa;padding:9px;border-radius:7px;font-size:11px}.item b{display:block;font-size:9px;color:#7b8592;text-transform:uppercase}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.top{gap:10px}.top .muted{display:none}}
</style></head><body>
<div class="top"><div class="brand">Vettri <span>Travels</span> — Admin</div><button class="btn" onclick="logout()">Logout</button></div>
<div id="login" class="wrap login card"><h1>Admin Login</h1><p class="muted">Review and approve customer booking requests.</p><div class="field"><label>Admin Password</label><input id="pass" type="password" placeholder="Enter password"></div><button class="btn primary" onclick="login()">Login</button><p class="muted">Demo password: <b>Vettri@2026</b></p></div>
<div id="panel" class="wrap hidden"><div class="stats"><div class="stat"><b id="total">0</b><span class="muted">Total Requests</span></div><div class="stat"><b id="pending">0</b><span class="muted">Pending</span></div><div class="stat"><b id="approved">0</b><span class="muted">Approved</span></div><div class="stat"><b id="rejected">0</b><span class="muted">Rejected</span></div></div>
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><h2 style="margin:0">Booking Requests</h2><p class="muted">Approve a request before treating it as confirmed.</p></div><button class="btn dark" onclick="render()">Refresh</button></div><div class="toolbar"><button class="btn" onclick="filter='All';render()">All</button><button class="btn" onclick="filter='Pending';render()">Pending</button><button class="btn" onclick="filter='Approved';render()">Approved</button><button class="btn" onclick="filter='Rejected';render()">Rejected</button><button class="btn red" onclick="clearRejected()">Clear Rejected</button></div><div id="list"></div></div></div>
<script>
const KEY='vettriBookings'; let filter='All';
function get(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
function set(x){localStorage.setItem(KEY,JSON.stringify(x))}
function login(){if(document.getElementById('pass').value==='Vettri@2026'){sessionStorage.setItem('vettriAdmin','1');show()}else alert('Wrong password')}
function logout(){sessionStorage.removeItem('vettriAdmin');location.reload()}
function show(){document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');render()}
function act(id,status){let a=get();a=a.map(x=>x.id===id?{...x,status,updatedAt:new Date().toISOString()}:x);set(a);render()}
function confirmWA(b){const text=`Hello ${b.name},%0A%0A✅ *BOOKING APPROVED - Vettri Travels*%0ABooking ID: ${b.id}%0ATrip: ${b.tripType}%0APickup: ${encodeURIComponent(b.pickup)}%0ADrop: ${encodeURIComponent(b.drop)}%0ADate: ${b.date}%0ATime: ${b.time}%0AVehicle: ${b.vehicle}%0A%0AYour booking has been approved by Vettri Travels. Please keep your phone available for driver details.`;window.open('https://wa.me/91'+b.mobile.replace(/\D/g,'')+'?text='+text,'_blank')}
function card(b){return `<div class="booking"><div class="booking-head"><div><b>${b.id}</b><div class="muted">${new Date(b.createdAt).toLocaleString()}</div></div><span class="badge ${b.status.toLowerCase()}">${b.status}</span></div><div class="grid"><div class="item"><b>Customer</b>${esc(b.name)}<br>${esc(b.mobile)}</div><div class="item"><b>Route</b>${esc(b.pickup)} → ${esc(b.drop)}</div><div class="item"><b>Trip</b>${esc(b.tripType)} • ${esc(b.acType)} • ${esc(b.vehicle)}</div><div class="item"><b>Pickup</b>${esc(b.date)} at ${esc(b.time)}</div></div><div class="actions">${b.status==='Pending'?`<button class="btn green" onclick="act('${b.id}','Approved')">✓ Approve</button><button class="btn red" onclick="act('${b.id}','Rejected')">✕ Reject</button>`:''}${b.status==='Approved'?`<button class="btn primary" onclick='confirmWA(${JSON.stringify(b)})'>Send WhatsApp Confirmation</button>`:''}</div></div>`}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){let a=get();document.getElementById('total').textContent=a.length;document.getElementById('pending').textContent=a.filter(x=>x.status==='Pending').length;document.getElementById('approved').textContent=a.filter(x=>x.status==='Approved').length;document.getElementById('rejected').textContent=a.filter(x=>x.status==='Rejected').length;let v=filter==='All'?a:a.filter(x=>x.status===filter);document.getElementById('list').innerHTML=v.length?v.map(card).join(''):'<p class="muted">No booking requests found.</p>'}
function clearRejected(){if(confirm('Delete all rejected bookings?')){set(get().filter(x=>x.status!=='Rejected'));render()}}
if(sessionStorage.getItem('vettriAdmin')==='1')show();
document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script></body></html>
